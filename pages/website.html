<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Websites</title>

  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
  <link rel="shortcut icon" href="../images/my-pic3.webp" type="image/webp">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f5f7fb;
      --white: #ffffff;
      --text: #333333;
      --muted: #666666;
      --primary: #1e9fab;
      --nav-bg: rgb(223, 223, 255);
      --radius: 11px;
      --live: #0a66c2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      padding: 0 8%;
      background: var(--nav-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .nav-name {
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .nav-name:hover {
      transform: translateX(-2px);
    }

    .back-btn {
      font-size: 30px;
      font-weight: 400;
      color: var(--primary);
      line-height: 0.8;
    }

    .home-link {
      font-size: 16px;
      font-weight: 600;
      color: rgb(8, 132, 173);
      transition: 0.3s ease;
    }

    .home-link:hover {
      transform: scale(1.08);
      color: #006f8d;
    }

    .projects-section {
      padding: 112px 8% 50px;
    }

    .project-block {
      background: var(--white);
      margin-bottom: 18px;
      border-radius: var(--radius);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.8);

      position: relative;
      z-index: 1;
    }

    .project-summary {
      width: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 15px;
      display: grid;
      grid-template-columns: 230px 1fr auto;
      gap: 18px;
      align-items: center;
      text-align: left;
    }

    .thumb-box {
      width: 230px;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      overflow: hidden;
      background: #eef1f7;
      display: block;
      box-shadow:
        0 12px 26px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: 0.3s ease;
    }

    .thumb-box:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .thumb-box iframe {
      width: 1280px;
      height: 800px;
      border: none;
      transform: scale(0.18);
      transform-origin: top left;
      pointer-events: none;
      background: white;
    }

    .project-title h2 {
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.25;
      font-weight: 650;
      color: var(--text);
    }

    .project-title span {
      display: inline-block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12.5px;
      transition: 0.25s ease;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .live-icon-btn,
    .drop-icon,
    .bottom-drop-icon {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: 0.3s ease;
      flex-shrink: 0;
      cursor: pointer;
    }

    .live-icon-btn {
      background: var(--live);
      color: white;
      box-shadow: 0 8px 17px rgba(10, 102, 194, 0.25);
    }

    .live-icon-btn i {
      font-size: 23px;
    }

    .live-icon-btn:hover {
      background: #004182;
      transform: translateY(-2px) scale(1.04);
    }

    .drop-icon,
    .bottom-drop-icon {
      background: #eef7ff;
      color: var(--primary);
      box-shadow:
        inset 0 1px 3px rgba(255, 255, 255, 0.8),
        0 7px 14px rgba(0, 0, 0, 0.08);
    }

    .drop-icon i,
    .bottom-drop-icon i {
      font-size: 30px;
      transition: 0.35s ease;
    }

    .project-block.open .drop-icon {
      background: var(--primary);
      color: white;
    }

    .project-block.open .drop-icon i {
      transform: rotate(180deg);
    }

    .project-block.open .project-title span {
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      height: 0;
      margin-top: 0;
      overflow: hidden;
    }

    .project-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.55s ease;
    }

    .project-content-inner {
      padding: 0 15px 22px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .project-block.open .project-content-inner {
      opacity: 1;
      transform: translateY(0);
    }

    .laptop-preview-wrap {
      width: min(900px, 100%);
      margin: 0 auto 0 0;
      padding-top: 8px;
      perspective: 1300px;
      perspective-origin: center bottom;
      transform-style: preserve-3d;
      overflow: visible;
    }

    .laptop-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #1b1f27, #06070a);
      border: 12px solid #151922;
      border-bottom-width: 18px;
      border-radius: 20px 20px 12px 12px;
      overflow: hidden;
      transform-origin: bottom center;
      transform: rotateX(-84deg) translateY(12px) scaleY(0.96);
      opacity: 0.98;
      transition:
        transform 0.82s cubic-bezier(0.19, 1, 0.22, 1),
        opacity 0.45s ease;
      will-change: transform;
      box-shadow:
        0 25px 55px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .laptop-screen::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      width: 86px;
      height: 19px;
      transform: translateX(-50%);
      background: #050609;
      border-radius: 0 0 9px 9px;
      z-index: 4;
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    .laptop-screen iframe {
      width: 1280px;
      height: 800px;
      border: none;
      background: white;
      display: block;
      transform-origin: top left;
      transform: scale(var(--preview-scale-x, 1), var(--preview-scale-y, 1));
      backface-visibility: hidden;
    }

    .laptop-base {
      position: relative;

      width: 106%;
      height: clamp(18px, 3.2vw, 34px);
      margin-left: -3%;
      background: linear-gradient(180deg, #d8dce4, #9da5b1);
      border-radius: 0 0 28px 28px;
      box-shadow:
        0 18px 30px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .laptop-base::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: clamp(58px, 13vw, 120px);
      height: clamp(5px, 0.9vw, 9px);
      transform: translateX(-50%);
      background: linear-gradient(180deg, #bfc5cf, #9fa7b2);
      border-radius: 0 0 12px 12px;
    }

    .laptop-base::after {
      content: "";
      position: absolute;
      bottom: -7px;
      left: 7%;
      width: 86%;
      height: clamp(5px, 0.9vw, 9px);
      background: rgba(0, 0, 0, 0.12);
      filter: blur(6px);
      border-radius: 50%;
    }



    /* Keep opened laptop preview always in front, even when base crosses the card border */
    .project-block.open,
    .project-block.closing {
      overflow: visible;
      position: relative;
      z-index: 20;
    }

    .project-block.open .project-content,
    .project-block.closing .project-content {
      overflow: visible;
      position: relative;
      z-index: 30;
    }

    .project-block.open .project-content-inner,
    .project-block.closing .project-content-inner {
      position: relative;
      z-index: 40;
    }

    .project-block.open .laptop-preview-wrap,
    .project-block.closing .laptop-preview-wrap {
      position: relative;
      z-index: 999;
      overflow: visible;
    }

    .project-block.open .laptop-screen {
      position: relative;
      z-index: 1000;
      transform: rotateX(0deg) translateY(0) scaleY(1);
      opacity: 1;
    }

    .project-block.closing .laptop-screen {
      position: relative;
      z-index: 1000;
    }

    .project-block.open .laptop-base,
    .project-block.closing .laptop-base {
      position: relative;
      z-index: 1001;
    }


    .website-info {
      margin-top: 22px;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }

    .post-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .live-btn {
      background: var(--live);
      color: white;
      width: min(260px, 50%);
      padding: 10px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      min-height: 40px;
      transition: 0.3s ease;
      box-shadow: 0 9px 21px rgba(10, 102, 194, 0.28);
    }

    .live-btn i {
      font-size: 20px;
    }

    .live-btn:hover {
      background: #004182;
      transform: translateY(-2px);
      box-shadow: 0 13px 27px rgba(10, 102, 194, 0.36);
    }

    .bottom-close-wrap {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .bottom-drop-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(145deg, #22b8c7, #147f8a);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 15px 30px rgba(30, 159, 171, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -8px 16px rgba(0, 0, 0, 0.12);
    }

    .bottom-drop-icon i {
      font-size: 34px;
      transform: rotate(180deg);
    }

    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 22px;
      background: #f4eeff;
      padding: 42px 8%;
      text-align: center;
    }

    .top-footer p {
      font-size: clamp(26px, 4vw, 35px);
      font-weight: 700;
    }

    .footer-menu {
      display: flex;
      gap: 35px;
      list-style: none;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer_menu_list a {
      color: var(--text);
      font-weight: 500;
      transition: 0.3s ease;
    }

    .footer_menu_list a:hover {
      color: var(--primary);
    }

    .footer-social-icons {
      display: flex;
      gap: 26px;
    }

    .icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s ease;
      overflow: hidden;
    }

    .icon a {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon i {
      font-size: 1.4rem;
      color: #fff;
    }

    .icon:nth-child(1) {
      background: linear-gradient(135deg, #feda75, #d62976, #962fbf, #4f5bd5);
    }

    .icon:nth-child(2) {
      background: #0077b5;
    }

    .icon:nth-child(3) {
      background: #FF0000;
    }

    .icon:nth-child(4) {
      background: #24292e;
    }

    .icon:hover {
      transform: scale(1.12) translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.28);
    }


    /* Open section highlight border - only visible when dropdown is open */
    .project-block.open {
      background:
        linear-gradient(135deg, rgb(255, 255, 255), rgb(255, 255, 255)) padding-box,
        linear-gradient(135deg, #49c7ff 0%, #7b5cff 52%, #e9c35b 100%) border-box;
      border: 1.5px solid transparent;
      box-shadow:
        0 18px 42px rgba(87, 103, 177, 0.16),
        0 8px 24px rgba(30, 159, 171, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
    }


    @media (max-width: 1050px) {
      .project-summary {
        grid-template-columns: 185px 1fr auto;
      }

      .thumb-box {
        width: 185px;
      }

      .thumb-box iframe {
        transform: scale(0.145);
      }

      .laptop-preview-wrap {
        width: min(760px, 100%);
        margin-left: 0;
        margin-right: auto;
      }
    }

    @media (max-width: 850px) {
      nav {
        height: 74px;
        padding: 0 6%;
      }

      .projects-section {
        padding: 100px 5% 40px;
      }

      .project-summary {
        grid-template-columns: 150px 1fr auto;
        gap: 12px;
      }

      .thumb-box {
        width: 150px;
      }

      .thumb-box iframe {
        width: 1000px;
        height: 625px;
        transform: scale(0.15);
      }

      .laptop-screen {
        border-width: 9px;
        border-bottom-width: 14px;
        border-radius: 16px 16px 10px 10px;
      }

      .laptop-base {
        height: 24px;
        border-radius: 0 0 22px 22px;
      }
    }

    @media (max-width: 620px) {
      nav {
        height: 68px;
      }

      .projects-section {
        padding: 88px 4% 34px;
      }

      .project-block {
        margin-bottom: 12px;
      }

      .project-summary {
        grid-template-columns: 118px 1fr auto;
        padding: 10px;
        gap: 9px;
      }

      .thumb-box {
        width: 118px;
        border-radius: 8px;
      }

      .thumb-box iframe {
        width: 760px;
        height: 475px;
        transform: scale(0.155);
      }

      .project-title h2 {
        font-size: 13.5px;
        line-height: 1.23;
      }

      .project-title span {
        font-size: 11px;
        margin-top: 3px;
      }

      .drop-icon,
      .live-icon-btn {
        width: 39px;
        height: 39px;
      }

      .drop-icon i {
        font-size: 25px;
      }

      .live-icon-btn i {
        font-size: 19px;
      }

      .summary-actions {
        gap: 8px;
      }

      .project-content-inner {
        padding: 0 10px 16px;
      }

      .laptop-preview-wrap {
        width: calc(100% - 42px);
        margin-left: 0;
        margin-right: auto;
      }

      .laptop-screen {
        border-width: 7px;
        border-bottom-width: 9px;
        border-radius: 13px 13px 8px 8px;
      }

      .laptop-screen::before {
        width: 45px;
        height: 9px;
        border-radius: 0 0 4px 4px;
      }

      .laptop-base {
        height: 11px;
        border-radius: 0 0 13px 13px;
      }

      .laptop-base::before {
        width: 58px;
        height: 4px;
      }

      .website-info {
        font-size: 10px;
        text-align: left;
      }

      .post-buttons {
        flex-direction: column;
      }

      .live-btn {
        width: 50%;
        min-width: 160px;
        font-size: 11px;
        padding: 9px 12px;
        min-height: 38px;
      }

      .bottom-drop-icon {
        width: 50px;
        height: 50px;
      }

      .bottom-drop-icon i {
        font-size: 30px;
      }

      .footer-menu {
        gap: 18px;
      }

      .icon {
        width: 45px;
        height: 45px;
      }
    }

    @media (max-width: 430px) {
      .project-summary {
        grid-template-columns: 105px 1fr auto;
      }

      .thumb-box {
        width: 105px;
      }

      .thumb-box iframe {
        width: 700px;
        height: 438px;
        transform: scale(0.15);
      }

      .project-title h2 {
        font-size: 12.7px;
      }

      .drop-icon,
      .live-icon-btn {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="nav-logo">
      <p class="nav-name" onclick="goBackToPortfolio()">
        <span class="back-btn">&lt;</span>
        Websites
      </p>
    </div>

    <a class="home-link" href="../index.html">Home</a>
  </nav>

  <main class="projects-section" id="websiteContainer"></main>

  <footer>
    <div class="top-footer">
      <p>Aman Sharma</p>
    </div>

    <div class="middle-footer">
      <ul class="footer-menu">
        <li class="footer_menu_list"><a href="../index.html#home">Home</a></li>
        <li class="footer_menu_list"><a href="../index.html#projects">Projects</a></li>
        <li class="footer_menu_list"><a href="../index.html#about">About</a></li>
        <li class="footer_menu_list"><a href="../index.html#skills">Skills</a></li>
        <li class="footer_menu_list"><a href="../index.html#contact">Contact</a></li>
      </ul>
    </div>

    <div class="footer-social-icons">

      <div class="icon">
        <a href="https://www.instagram.com/_ar.sharma/" target="_blank">
          <i class="uil uil-instagram"></i>
        </a>
      </div>

      <div class="icon">
        <a href="https://www.linkedin.com/in/a-amansharma/" target="_blank">
          <i class="uil uil-linkedin-alt"></i>
        </a>
      </div>

      <div class="icon">
        <a href="https://www.youtube.com/@a-amansharma" target="_blank">
          <i class="uil uil-youtube"></i>
        </a>
      </div>

      <div class="icon">
        <a href="https://github.com/a-amansharma" target="_blank">
          <i class="uil uil-github-alt"></i>
        </a>
      </div>



    </div>
  </footer>

  <script>
    const websites = [
      {
        title: "Personal Portfolio Website",
        url: "https://a-amansharma.github.io/Portfolio/",
        description: "My personal portfolio website showcasing projects, robotics work, designs, sketches, and profile details."
      },
      {
        title: "Book Showcase Website",
        url: "https://a-amansharma.github.io/BookShowcase/",
        description: "A clean book showcase webpage designed to present books in a visually attractive and responsive layout."
      },
      {
        title: "PW IOI Website",
        url: "https://a-amansharma.github.io/pwioi/",
        description: "A website created around PW IOI with a structured layout, responsive sections, and polished visual presentation."
      },
      {
        title: "LogiCode Semester 2 Project",
        url: "https://a-amansharma.github.io/LogiCode-Sem2_Project/",
        description: "A semester project website focused on presenting LogiCode with a modern frontend and organized project sections."
      },
      {
        title: "EduPort Semester 1 Project",
        url: "https://a-amansharma.github.io/EduPort-sem1/",
        description: "An educational portal-style semester project made with a responsive UI and clean section-based design."
      },
      {
        title: "PW IOI Vercel Website",
        url: "https://pw-ioi.vercel.app/",
        description: "A live deployed website hosted on Vercel with a clean frontend and professional webpage structure."
      },
      {
        title: "JR Verse Website",
        url: "https://jr-verse.vercel.app/",
        description: "A modern live website hosted on Vercel with a responsive design and polished preview experience."
      }
    ];

    const websiteContainer = document.getElementById("websiteContainer");

    websites.forEach((site) => {
      const block = document.createElement("section");
      block.className = "project-block";

      block.innerHTML = `
        <div class="project-summary" role="button" tabindex="0">
          <div class="thumb-box" aria-label="Open ${site.title} preview">
            <iframe src="${site.url}" title="${site.title} Thumbnail" loading="lazy"></iframe>
          </div>

          <div class="project-title">
            <h2>${site.title}</h2>
            <span>Click to see preview</span>
          </div>

          <div class="summary-actions">
            <a href="${site.url}" target="_blank" class="live-icon-btn" aria-label="Open live website">
              <i class="uil uil-external-link-alt"></i>
            </a>

            <button class="drop-icon" type="button" aria-label="Open website details">
              <i class="uil uil-angle-down"></i>
            </button>
          </div>
        </div>

        <div class="project-content">
          <div class="project-content-inner">
            <div class="laptop-preview-wrap">
              <div class="laptop-screen">
                <iframe src="${site.url}" title="${site.title} Live Interactive Preview" loading="lazy"></iframe>
              </div>
              <div class="laptop-base"></div>
            </div>

            <p class="website-info">${site.description}</p>

            <div class="post-buttons">
              <a href="${site.url}" target="_blank" class="live-btn">
                <i class="uil uil-external-link-alt"></i>
                Visit Live Site
              </a>
            </div>

            <div class="bottom-close-wrap">
              <button class="bottom-drop-icon" type="button" aria-label="Close website details">
                <i class="uil uil-angle-down"></i>
              </button>
            </div>
          </div>
        </div>
      `;

      websiteContainer.appendChild(block);
    });



    const PREVIEW_WIDTH = 1280;
    const PREVIEW_HEIGHT = 800;

    function fitLaptopPreviews() {
      document.querySelectorAll(".laptop-screen").forEach((screen) => {
        const frame = screen.querySelector("iframe");
        if (!frame) return;

        const scaleX = screen.clientWidth / PREVIEW_WIDTH;
        const scaleY = screen.clientHeight / PREVIEW_HEIGHT;

        frame.style.setProperty("--preview-scale-x", scaleX);
        frame.style.setProperty("--preview-scale-y", scaleY);
      });
    }
    function goBackToPortfolio() {
      if (
        document.referrer &&
        document.referrer.includes(window.location.hostname)
      ) {
        history.back();
      } else {
        window.location.href = "../index.html#projects";
      }
    }

    function toggleProject(block) {
      const content = block.querySelector(".project-content");

      if (block.classList.contains("open")) {
        content.style.maxHeight = content.scrollHeight + "px";
        block.classList.add("closing");

        requestAnimationFrame(() => {
          content.style.maxHeight = "0px";
          block.classList.remove("open");
        });

        setTimeout(() => {
          block.classList.remove("closing");
        }, 560);
      } else {
        block.classList.remove("closing");
        block.classList.add("open");
        fitLaptopPreviews();
        content.style.maxHeight = content.scrollHeight + "px";

        setTimeout(() => {
          if (block.classList.contains("open")) {
            content.style.maxHeight = "none";
          }
        }, 560);
      }
    }

    document.querySelectorAll(".project-summary").forEach((summary) => {
      summary.addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        toggleProject(summary.closest(".project-block"));
      });

      summary.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleProject(summary.closest(".project-block"));
        }
      });
    });

    document.querySelectorAll(".bottom-drop-icon").forEach((button) => {
      button.addEventListener("click", () => {
        const block = button.closest(".project-block");
        toggleProject(block);

        block.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });
    });

    window.addEventListener("resize", () => {
      fitLaptopPreviews();

      document.querySelectorAll(".project-block.open .project-content").forEach((content) => {
        content.style.maxHeight = "none";
      });
    });

    window.addEventListener("load", fitLaptopPreviews);
  </script>

</body>

</html>
